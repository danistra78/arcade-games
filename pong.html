<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Ping Pong - Arrow Keys</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--t-bg, #050505);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--t-text, white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        canvas {
            border: 4px solid var(--t-border, #333);
            background-color: var(--t-bg, #000);
            display: block;
        }

        #score-board {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .player-score { color: var(--t-primary, #00ffff); text-shadow: 0 0 15px var(--t-primary, #00ffff); }
        .ai-score { color: var(--t-secondary, #ff00ff); text-shadow: 0 0 15px var(--t-secondary, #ff00ff); }

        .highscore-hint {
            color: var(--t-accent, #ffe600);
            font-size: 16px;
            margin-bottom: 10px;
        }

        .controls-hint {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="highscore-hint">Highscore: <span id="highscore">0</span></div>

    <div id="score-board">
        <span id="p1-score" class="player-score">0</span>
        <span style="color: #555;">|</span>
        <span id="ai-score" class="ai-score">0</span>
    </div>

    <div id="game-container">
        <canvas id="pongCanvas"></canvas>
    </div>

    <div class="controls-hint">Steuerung: Pfeiltasten Hoch / Runter</div>

    <script src="shared/game-core.js"></script>
    <script src="shared/theme.js"></script>
    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");
        const p1ScoreDisplay = document.getElementById("p1-score");
        const aiScoreDisplay = document.getElementById("ai-score");
        const highscoreDisplay = document.getElementById("highscore");

        canvas.width = 800;
        canvas.height = 500;

        const HIGHSCORE_KEY = "pong_highscore";
        let highscore = GameCore.loadHighscore(HIGHSCORE_KEY);
        highscoreDisplay.innerText = highscore;

        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 8;
        const INITIAL_BALL_SPEED = 300; // px/s
        const MAX_BALL_SPEED = 1080; // px/s - Cap verhindert Tunneln durch die Paddles
        const SPEED_INCREMENT = 1.1;
        const AI_ERROR_FACTOR = 0.08; // Lerp-Faktor bei 60fps, wird dt-skaliert angewendet
        const PLAYER_SPEED = 480; // px/s

        let COLORS = {};
        function applyTheme(palette) {
            COLORS = {
                bg: palette.bg,
                net: palette.border,
                player: palette.primary,
                ai: palette.secondary,
                ball: palette.text
            };
        }
        applyTheme(Theme.current());
        Theme.onThemeChange(applyTheme);

        const player = {
            x: 10,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0
        };

        const ai = {
            x: canvas.width - PADDLE_WIDTH - 10,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: BALL_SIZE,
            speed: INITIAL_BALL_SPEED,
            dx: INITIAL_BALL_SPEED,
            dy: INITIAL_BALL_SPEED
        };

        let particles = [];

        // Keyboard Input Handling
        const keys = {
            ArrowUp: false,
            ArrowDown: false
        };

        window.addEventListener("keydown", (e) => {
            if (e.key in keys) keys[e.key] = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = INITIAL_BALL_SPEED;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * INITIAL_BALL_SPEED;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * INITIAL_BALL_SPEED;
        }

        function drawRect(x, y, w, h, color) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
        }

        function drawBall(x, y, r, color) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function registerHighscore() {
            const best = Math.max(player.score, ai.score);
            if (best > highscore) {
                highscore = GameCore.saveHighscore(HIGHSCORE_KEY, best);
                highscoreDisplay.innerText = highscore;
            }
        }

        function update(dt) {
            // Player Movement (Pfeiltasten)
            if (keys.ArrowUp && player.y > 0) {
                player.y -= PLAYER_SPEED * dt;
            }
            if (keys.ArrowDown && player.y < canvas.height - player.height) {
                player.y += PLAYER_SPEED * dt;
            }

            // Ball Movement
            ball.x += ball.dx * dt;
            ball.y += ball.dy * dt;

            // Wall Collision
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.dy *= -1;
            }

            // AI Movement (Error Factor, dt-skaliert)
            const aiTargetY = ball.y - ai.height / 2;
            const aiFactor = Math.min(1, AI_ERROR_FACTOR * 60 * dt);
            ai.y += (aiTargetY - ai.y) * aiFactor;

            // Paddle Collision
            let paddle = (ball.x < canvas.width / 2) ? player : ai;

            if (detectCollision(ball, paddle)) {
                ball.dx *= -1;
                ball.speed = Math.min(ball.speed * SPEED_INCREMENT, MAX_BALL_SPEED);

                const angle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(angle) * ball.speed;
                ball.dy = Math.sin(angle) * ball.speed;

                if (paddle === player) {
                    ball.x = player.x + player.width + ball.radius;
                } else {
                    ball.x = ai.x - ball.radius;
                }

                GameCore.spawnParticles(particles, ball.x, ball.y, COLORS[paddle === player ? 'player' : 'ai'], 10, { speed: 200, life: 0.4 });
            }

            // Scoring
            if (ball.x - ball.radius < 0) {
                ai.score++;
                aiScoreDisplay.innerText = ai.score;
                GameCore.spawnParticles(particles, 0, ball.y, COLORS.ai, 18, { speed: 260, life: 0.6 });
                registerHighscore();
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                p1ScoreDisplay.innerText = player.score;
                GameCore.spawnParticles(particles, canvas.width, ball.y, COLORS.player, 18, { speed: 260, life: 0.6 });
                registerHighscore();
                resetBall();
            }

            GameCore.updateParticles(particles, dt);
        }

        function detectCollision(b, p) {
            return b.x + b.radius > p.x &&
                   b.x - b.radius < p.x + p.width &&
                   b.y + b.radius > p.y &&
                   b.y - b.radius < p.y + p.height;
        }

        function render() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = COLORS.net;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            drawRect(player.x, player.y, player.width, player.height, COLORS.player);
            drawRect(ai.x, ai.y, ai.width, ai.height, COLORS.ai);
            drawBall(ball.x, ball.y, ball.radius, COLORS.ball);
            GameCore.drawParticles(ctx, particles);
        }

        GameCore.startLoop((dt) => {
            update(dt);
            render();
        });
    </script>
</body>
</html>
