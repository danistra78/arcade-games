<!DOCTYPE html>
<html lang="de"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Hanwavel Arcade</title>
    <style>
        :root {
            --neon-cyan: var(--t-primary, #0ff);
            --neon-pink: var(--t-secondary, #f0f);
            --bg-dark: var(--t-bg, #050505);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--t-text, #fff);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }
        h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            font-size: 3rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--neon-pink);
            margin-bottom: 40px;
            font-size: 1rem;
            text-shadow: 0 0 5px var(--neon-pink);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }
        .game-card {
            background: rgba(17, 17, 17, 0.8);
            border: 2px solid var(--neon-pink);
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--neon-pink);
            background: var(--neon-pink);
            color: #000;
        }
        .game-card h2 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 60px;
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>ARCADE</h1>
    <div class="grid">
        
            
                <a href="asteroids.html" class="game-card">
                     <h2>asteroids</h2>
                </a>
            

                <a href="breakout.html" class="game-card">
                     <h2>breakout</h2>
                </a>
            

                <a href="donkey-kong.html" class="game-card">
                     <h2>donkey-kong</h2>
                </a>
            

                <a href="pong.html" class="game-card">
                     <h2>pong</h2>
                </a>
            
            
                <a href="space-invaders.html" class="game-card">
                     <h2>space-invaders</h2>
                </a>
            
                <a href="tetris.html" class="game-card">
                     <h2>tetris</h2>
                </a>

                <a href="wizball.html" class="game-card">
                     <h2>wizball</h2>
                </a>

    </div>

    <script src="shared/theme.js"></script>
</body></html>
