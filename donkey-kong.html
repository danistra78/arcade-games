<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON KONG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--t-bg, #050505);
            color: var(--t-text, #fff);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid var(--t-border, #333);
        }

        canvas {
            display: block;
            background-color: var(--t-bg, #000);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 12px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--t-primary, #0ff);
            color: var(--t-primary, #0ff);
            z-index: 5;
        }

        #start-screen, #game-over-screen, #level-clear-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid var(--t-primary, #0ff);
            box-shadow: 0 0 15px var(--t-primary, #0ff);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
        }

        h1 {
            color: var(--t-primary, #0ff);
            text-shadow: 0 0 10px var(--t-primary, #0ff);
            margin: 0;
            font-size: 40px;
            letter-spacing: 4px;
        }

        p {
            font-size: 16px;
            color: #ccc;
            margin: 0;
        }

        button {
            background: transparent;
            color: var(--t-secondary, #f0f);
            border: 2px solid var(--t-secondary, #f0f);
            padding: 10px 30px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 5px var(--t-secondary, #f0f);
        }

        button:hover {
            background: var(--t-secondary, #f0f);
            color: #000;
            box-shadow: 0 0 20px var(--t-secondary, #f0f);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div>SCORE: <span id="scoreEl">0</span></div>
            <div>BONUS: <span id="bonusEl">5000</span></div>
            <div>LEVEL: <span id="levelEl">1</span></div>
            <div>LIVES: <span id="livesEl">3</span></div>
            <div>HIGHSCORE: <span id="highscoreEl">0</span></div>
        </div>
        <div id="start-screen">
            <h1>NEON KONG</h1>
            <p>Steuerung: Pfeiltasten / WASD</p>
            <p>Leitern: Hoch/Runter | Springen: Leertaste</p>
            <p>Rette die Prinzessin! Springe über Fässer für Extrapunkte.</p>
            <button id="startBtn">SPIEL STARTEN</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>Endscore: <span id="finalScore">0</span></p>
            <button id="restartBtn">NEUSTART</button>
        </div>
        <div id="level-clear-screen" class="hidden">
            <h1>LEVEL GESCHAFFT!</h1>
            <p>Prinzessin gerettet: +<span id="clearBonus">0</span> Punkte</p>
            <button id="nextLevelBtn">NÄCHSTES LEVEL</button>
        </div>
    </div>

    <script src="shared/game-core.js"></script>
    <script src="shared/theme.js"></script>
    <script>
        // ============================================
        // KONFIGURATION
        // ============================================
        const CONFIG = {
            playerSpeed: 140,
            climbSpeed: 90,
            jumpVelocity: 380,
            gravity: 900,
            barrelSpeedBase: 90,
            barrelSpeedPerLevel: 15,
            barrelIntervalBase: 2.6,
            barrelIntervalMin: 1.1,
            barrelLadderChance: 0.18,
            bonusStart: 5000,
            bonusDrainPerSec: 120,
            jumpScore: 100,
            princessScore: 1000
        };

        // Plattformen (y = Oberkante), Index 0 = Boden, 5 = oberste (Kongs Podest)
        const PLATFORMS = [
            { y: 560, x1: 0, x2: 800 },
            { y: 470, x1: 0, x2: 800 },
            { y: 380, x1: 0, x2: 800 },
            { y: 290, x1: 0, x2: 800 },
            { y: 200, x1: 0, x2: 800 },
            { y: 110, x1: 60, x2: 460 }
        ];

        // Walzrichtung der Fässer pro Plattform (alternierend wie im Original)
        const BARREL_DIR = [-1, 1, -1, 1, -1, 1];

        // Leitern: topY = Plattform oben, botY = Plattform unten
        const LADDERS = [
            { x: 120, topY: 470, botY: 560 },
            { x: 660, topY: 470, botY: 560 },
            { x: 300, topY: 380, botY: 470 },
            { x: 720, topY: 380, botY: 470 },
            { x: 150, topY: 290, botY: 380 },
            { x: 520, topY: 290, botY: 380 },
            { x: 360, topY: 200, botY: 290 },
            { x: 680, topY: 200, botY: 290 },
            { x: 220, topY: 110, botY: 200 }
        ];

        const PRINCESS = { x: 420, y: 110 };
        const KONG = { x: 110, y: 110 };

        // ============================================
        // STATE
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const bonusEl = document.getElementById('bonusEl');
        const levelEl = document.getElementById('levelEl');
        const livesEl = document.getElementById('livesEl');
        const highscoreEl = document.getElementById('highscoreEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const levelClearScreen = document.getElementById('level-clear-screen');
        const finalScoreEl = document.getElementById('finalScore');
        const clearBonusEl = document.getElementById('clearBonus');

        const state = {
            running: false,
            gameOver: false,
            score: 0,
            lives: 3,
            level: 1,
            bonus: CONFIG.bonusStart,
            highscore: GameCore.loadHighscore('neonKongHighscore'),
            keys: {},
            barrelTimer: 0,
            kongThrowTimer: 0,
            invulnTimer: 0
        };

        const COLORS = {
            bg: '#000',
            platform: '#0ff',
            ladder: '#f0f',
            player: '#ff0',
            playerCap: '#f00',
            barrel: '#f80',
            kong: '#f44',
            kongEyes: '#fff',
            princess: '#f9f',
            princessHead: '#fd9',
            accent: '#ff0'
        };

        function applyTheme(palette) {
            COLORS.bg = palette.bg;
            COLORS.platform = palette.primary;
            COLORS.ladder = palette.secondary;
            COLORS.player = palette.accent;
            COLORS.playerCap = palette.warn;
            COLORS.barrel = palette.good;
            COLORS.kong = palette.warn;
            COLORS.princess = palette.secondary;
            COLORS.accent = palette.accent;
        }
        applyTheme(Theme.current());
        Theme.onThemeChange((palette) => {
            applyTheme(palette);
            if (!state.running) draw();
        });

        let player = null;
        let barrels = [];
        let particles = [];

        class Player {
            constructor() {
                this.w = 18;
                this.h = 26;
                this.reset();
            }
            reset() {
                this.x = 60;
                this.y = PLATFORMS[0].y;      // Fussposition
                this.vx = 0;
                this.vy = 0;
                this.onGround = true;
                this.climbing = false;
                this.climbLadder = null;
                this.platformIdx = 0;
                this.facing = 1;
            }
            get feet() { return this.y; }
            get left() { return this.x - this.w / 2; }
            get right() { return this.x + this.w / 2; }
            get top() { return this.y - this.h; }
        }

        // ============================================
        // INPUT
        // ============================================
        window.addEventListener('keydown', e => {
            state.keys[e.key] = true;
            state.keys[e.key.toLowerCase()] = true;
            if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
        });
        window.addEventListener('keyup', e => {
            state.keys[e.key] = false;
            state.keys[e.key.toLowerCase()] = false;
        });

        function keyLeft()  { return state.keys['ArrowLeft'] || state.keys['a']; }
        function keyRight() { return state.keys['ArrowRight'] || state.keys['d']; }
        function keyUp()    { return state.keys['ArrowUp'] || state.keys['w']; }
        function keyDown()  { return state.keys['ArrowDown'] || state.keys['s']; }
        function keyJump()  { return state.keys[' ']; }

        // ============================================
        // SPIELLOGIK
        // ============================================
        function findLadderUp(p) {
            // Leiter, deren Fuss (botY) auf der aktuellen Plattform steht und deren
            // Kopf (topY) eine Etage höher liegt
            for (const l of LADDERS) {
                if (Math.abs(l.botY - p.feet) < 6 && Math.abs(l.x - p.x) < 12) return l;
            }
            return null;
        }

        function findLadderDown(p) {
            // Leiter, deren Kopf (topY) auf der aktuellen Plattform liegt
            for (const l of LADDERS) {
                if (Math.abs(l.topY - p.feet) < 6 && Math.abs(l.x - p.x) < 12) return l;
            }
            return null;
        }

        function updatePlayer(dt) {
            const p = player;

            if (p.climbing) {
                const l = p.climbLadder;
                p.x = l.x;
                p.vx = 0;
                p.vy = 0;
                if (keyUp()) p.y -= CONFIG.climbSpeed * dt;
                if (keyDown()) p.y += CONFIG.climbSpeed * dt;

                // Ausstieg oben
                if (p.y <= l.topY) {
                    p.y = l.topY;
                    p.climbing = false;
                    p.climbLadder = null;
                    p.onGround = true;
                }
                // Ausstieg unten
                if (p.y >= l.botY) {
                    p.y = l.botY;
                    p.climbing = false;
                    p.climbLadder = null;
                    p.onGround = true;
                }
                return;
            }

            // Leiter betreten
            if (p.onGround && keyUp()) {
                const l = findLadderUp(p);
                if (l) {
                    p.climbing = true;
                    p.climbLadder = l;
                    p.onGround = false;
                    return;
                }
            }
            if (p.onGround && keyDown()) {
                const l = findLadderDown(p);
                if (l) {
                    p.climbing = true;
                    p.climbLadder = l;
                    p.onGround = false;
                    p.y += 6;
                    return;
                }
            }

            // Horizontal
            p.vx = 0;
            if (keyLeft()) { p.vx = -CONFIG.playerSpeed; p.facing = -1; }
            if (keyRight()) { p.vx = CONFIG.playerSpeed; p.facing = 1; }

            // Sprung
            if (keyJump() && p.onGround) {
                p.vy = -CONFIG.jumpVelocity;
                p.onGround = false;
            }

            // Physik
            p.vy += CONFIG.gravity * dt;
            const prevY = p.y;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // Wände
            if (p.x < 10) p.x = 10;
            if (p.x > canvas.width - 10) p.x = canvas.width - 10;

            // Landung: höchste Plattform, deren Oberkante in diesem Frame überquert wurde
            if (p.vy >= 0) {
                p.onGround = false;
                for (let i = PLATFORMS.length - 1; i >= 0; i--) {
                    const pl = PLATFORMS[i];
                    if (p.x >= pl.x1 && p.x <= pl.x2 && prevY <= pl.y && p.y >= pl.y) {
                        p.y = pl.y;
                        p.vy = 0;
                        p.onGround = true;
                        p.platformIdx = i;
                        break;
                    }
                }
            }
        }

        function spawnBarrel() {
            barrels.push({
                x: KONG.x + 30,
                y: KONG.y - 8,
                vy: 0,
                radius: 8,
                mode: 'fall',          // 'roll' | 'fall' | 'ladder'
                dir: BARREL_DIR[5],
                platformIdx: -1,
                ladder: null,
                rotation: 0,
                scored: false
            });
            state.kongThrowTimer = 0.35;
        }

        function updateBarrels(dt) {
            const speed = CONFIG.barrelSpeedBase + (state.level - 1) * CONFIG.barrelSpeedPerLevel;

            for (let i = barrels.length - 1; i >= 0; i--) {
                const b = barrels[i];

                if (b.mode === 'roll') {
                    b.x += b.dir * speed * dt;
                    b.rotation += b.dir * speed * dt * 0.08;

                    // Leiter hinunter? (nur direkt nach dem Landen, nicht sofort wieder)
                    for (const l of LADDERS) {
                        if (Math.abs(l.topY - (b.y + b.radius)) < 3 && Math.abs(l.x - b.x) < 4 &&
                            Math.random() < CONFIG.barrelLadderChance * dt * 4) {
                            b.mode = 'ladder';
                            b.ladder = l;
                            b.x = l.x;
                            break;
                        }
                    }

                    // Über Plattformkante gerollt -> fallen
                    if (b.mode === 'roll') {
                        const pl = PLATFORMS[b.platformIdx];
                        if (!pl || b.x < pl.x1 - 4 || b.x > pl.x2 + 4) {
                            b.mode = 'fall';
                            b.vy = 0;
                        }
                    }
                }

                if (b.mode === 'ladder') {
                    b.y += speed * 1.2 * dt;
                    b.rotation += dt * 6;
                    if (b.y >= b.ladder.botY) {
                        b.y = b.ladder.botY - b.radius;
                        b.mode = 'roll';
                        b.platformIdx = PLATFORMS.findIndex(pl => Math.abs(pl.y - b.ladder.botY) < 3);
                        b.dir = b.platformIdx >= 0 ? BARREL_DIR[b.platformIdx] : -1;
                    }
                }

                if (b.mode === 'fall') {
                    b.vy += CONFIG.gravity * dt;
                    b.y += b.vy * dt;
                    b.rotation += dt * 4;

                    // Auf Plattform gelandet?
                    for (let pi = PLATFORMS.length - 1; pi >= 0; pi--) {
                        const pl = PLATFORMS[pi];
                        if (b.x >= pl.x1 && b.x <= pl.x2 &&
                            b.y + b.radius >= pl.y && b.y + b.radius <= pl.y + 20 && b.vy > 0) {
                            b.y = pl.y - b.radius;
                            b.vy = 0;
                            b.mode = 'roll';
                            b.platformIdx = pi;
                            b.dir = BARREL_DIR[pi];
                            break;
                        }
                    }
                }

                // Aus dem Bildschirm -> entfernen
                if (b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
                    barrels.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            const p = player;
            const invulnerable = state.invulnTimer > 0;

            for (const b of barrels) {
                // Sprung über Fass -> Punkte (funktioniert auch während Unverwundbarkeit)
                if (!b.scored && !p.onGround && !p.climbing &&
                    Math.abs(b.x - p.x) < 22 && p.feet < b.y - 10) {
                    b.scored = true;
                    state.score += CONFIG.jumpScore;
                    GameCore.spawnParticles(particles, b.x, b.y - 20, COLORS.accent, 6, { speed: 120, life: 0.6, gravity: 300 });
                }

                // Kreis-Rechteck-Kollision Spieler/Fass (nur wenn verwundbar)
                if (!invulnerable) {
                    const cx = Math.max(p.left, Math.min(b.x, p.right));
                    const cy = Math.max(p.top, Math.min(b.y, p.feet));
                    const dx = b.x - cx;
                    const dy = b.y - cy;
                    if (dx * dx + dy * dy < b.radius * b.radius) {
                        playerHit();
                        return;
                    }
                }
            }

            // Prinzessin erreicht?
            if (Math.abs(p.x - PRINCESS.x) < 28 && Math.abs(p.feet - PRINCESS.y) < 40) {
                levelClear();
            }
        }

        function playerHit() {
            state.lives--;
            GameCore.spawnParticles(particles, player.x, player.y - 13, COLORS.playerCap, 15, { speed: 150, life: 0.6, gravity: 300 });
            if (state.lives <= 0) {
                triggerGameOver();
            } else {
                state.invulnTimer = 1.5;
                player.reset();
                barrels = [];
                state.barrelTimer = 1.0;
            }
            updateUI();
        }

        function levelClear() {
            state.running = false;
            const bonus = Math.floor(state.bonus) + CONFIG.princessScore;
            state.score += bonus;
            clearBonusEl.innerText = bonus;
            state.level++;
            saveHighscore();
            updateUI();
            levelClearScreen.classList.remove('hidden');
        }

        function nextLevel() {
            levelClearScreen.classList.add('hidden');
            barrels = [];
            player.reset();
            state.bonus = CONFIG.bonusStart;
            state.barrelTimer = 1.2;
            state.invulnTimer = 1.0;
            state.running = true;
            if (loopController) loopController.stop();
            loopController = GameCore.startLoop(gameLoop);
        }

        function triggerGameOver() {
            state.running = false;
            state.gameOver = true;
            saveHighscore();
            finalScoreEl.innerText = state.score;
            updateUI();
            gameOverScreen.classList.remove('hidden');
        }

        function saveHighscore() {
            if (state.score > state.highscore) {
                state.highscore = GameCore.saveHighscore('neonKongHighscore', state.score);
            }
        }

        function startGame() {
            state.score = 0;
            state.lives = 3;
            state.level = 1;
            state.bonus = CONFIG.bonusStart;
            state.gameOver = false;
            state.running = true;
            state.barrelTimer = 1.5;
            state.invulnTimer = 1.0;
            state.kongThrowTimer = 0;
            barrels = [];
            particles = [];
            player = new Player();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            levelClearScreen.classList.add('hidden');
            updateUI();
            if (loopController) loopController.stop();
            loopController = GameCore.startLoop(gameLoop);
        }

        function updateUI() {
            scoreEl.innerText = state.score;
            bonusEl.innerText = Math.max(0, Math.floor(state.bonus));
            levelEl.innerText = state.level;
            livesEl.innerText = state.lives;
            highscoreEl.innerText = state.highscore;
        }

        // ============================================
        // GAME LOOP
        // ============================================
        let loopController = null;

        function gameLoop(dt) {
            if (!state.running) {
                loopController.stop();
                return;
            }

            // Bonus runterzählen
            state.bonus -= CONFIG.bonusDrainPerSec * dt;
            if (state.bonus <= 0) {
                state.bonus = CONFIG.bonusStart;
                playerHit();
            }
            if (state.gameOver) {
                draw();
                loopController.stop();
                return;
            }

            // Fässer spawnen
            state.barrelTimer -= dt;
            if (state.barrelTimer <= 0) {
                spawnBarrel();
                const interval = Math.max(
                    CONFIG.barrelIntervalMin,
                    CONFIG.barrelIntervalBase - (state.level - 1) * 0.25
                );
                state.barrelTimer = interval * (0.8 + Math.random() * 0.4);
            }
            if (state.kongThrowTimer > 0) state.kongThrowTimer -= dt;
            if (state.invulnTimer > 0) state.invulnTimer -= dt;

            updatePlayer(dt);
            updateBarrels(dt);
            GameCore.updateParticles(particles, dt);
            if (!state.gameOver) checkCollisions();

            updateUI();
            draw();
        }

        // ============================================
        // ZEICHNEN
        // ============================================
        function drawPlatform(pl, color) {
            ctx.strokeStyle = color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pl.x1, pl.y);
            ctx.lineTo(pl.x2, pl.y);
            ctx.stroke();
            // Girder-X-Muster
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.5;
            for (let x = pl.x1 + 6; x < pl.x2 - 6; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, pl.y + 2);
                ctx.lineTo(x + 14, pl.y + 12);
                ctx.moveTo(x + 14, pl.y + 2);
                ctx.lineTo(x, pl.y + 12);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawLadder(l) {
            ctx.strokeStyle = COLORS.ladder;
            ctx.shadowBlur = 6;
            ctx.shadowColor = COLORS.ladder;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(l.x - 8, l.topY);
            ctx.lineTo(l.x - 8, l.botY);
            ctx.moveTo(l.x + 8, l.topY);
            ctx.lineTo(l.x + 8, l.botY);
            ctx.stroke();
            ctx.lineWidth = 1;
            for (let y = l.topY + 8; y < l.botY; y += 12) {
                ctx.beginPath();
                ctx.moveTo(l.x - 8, y);
                ctx.lineTo(l.x + 8, y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function drawPlayer() {
            const p = player;
            if (state.invulnTimer > 0 && Math.floor(state.invulnTimer * 10) % 2 === 0) return;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS.player;
            ctx.fillStyle = COLORS.player;
            // Körper
            ctx.fillRect(-p.w / 2 + 2, -p.h + 8, p.w - 4, p.h - 8);
            // Kopf mit Mütze
            ctx.fillRect(-5, -p.h, 10, 8);
            ctx.fillStyle = COLORS.playerCap;
            ctx.fillRect(-6, -p.h, 12, 3);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawBarrel(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rotation);
            ctx.shadowBlur = 8;
            ctx.shadowColor = COLORS.barrel;
            ctx.strokeStyle = COLORS.barrel;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-b.radius, 0);
            ctx.lineTo(b.radius, 0);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawKong() {
            const throwing = state.kongThrowTimer > 0;
            ctx.save();
            ctx.translate(KONG.x, KONG.y);
            ctx.shadowBlur = 12;
            ctx.shadowColor = COLORS.kong;
            ctx.fillStyle = COLORS.kong;
            // Körper
            ctx.fillRect(-25, -55, 50, 55);
            // Kopf
            ctx.fillRect(-15, -72, 30, 20);
            // Arme (beim Werfen oben)
            if (throwing) {
                ctx.fillRect(-35, -85, 12, 35);
                ctx.fillRect(23, -85, 12, 35);
            } else {
                ctx.fillRect(-38, -50, 12, 45);
                ctx.fillRect(26, -50, 12, 45);
            }
            // Augen
            ctx.fillStyle = COLORS.kongEyes;
            ctx.fillRect(-9, -67, 6, 5);
            ctx.fillRect(3, -67, 6, 5);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawPrincess() {
            ctx.save();
            ctx.translate(PRINCESS.x, PRINCESS.y);
            ctx.shadowBlur = 12;
            ctx.shadowColor = COLORS.princess;
            // Kleid (Dreieck)
            ctx.fillStyle = COLORS.princess;
            ctx.beginPath();
            ctx.moveTo(0, -34);
            ctx.lineTo(12, 0);
            ctx.lineTo(-12, 0);
            ctx.closePath();
            ctx.fill();
            // Kopf
            ctx.fillStyle = COLORS.princessHead;
            ctx.beginPath();
            ctx.arc(0, -40, 6, 0, Math.PI * 2);
            ctx.fill();
            // Hilferuf
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('HILFE!', 0, -55);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            PLATFORMS.forEach(pl => drawPlatform(pl, COLORS.platform));
            LADDERS.forEach(drawLadder);
            drawKong();
            drawPrincess();
            barrels.forEach(drawBarrel);
            if (player) drawPlayer();

            // Partikel
            GameCore.drawParticles(ctx, particles);
            ctx.globalAlpha = 1;
        }

        // ============================================
        // EVENTS / INIT
        // ============================================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);

        highscoreEl.innerText = state.highscore;

        // Hintergrund-Vorschau zeichnen
        player = new Player();
        draw();
    </script>
</body>
</html>
