<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Invaders - Expert Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--t-bg, #050505);
            color: var(--t-text, #fff);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid var(--t-border, #333);
        }

        canvas {
            display: block;
            background-color: var(--t-bg, #000);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px #fff;
            font-size: 18px;
            font-weight: bold;
        }

        .ui-text {
            color: #fff;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid var(--t-primary, #0ff);
            box-shadow: 0 0 15px var(--t-primary, #0ff);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
        }

        h1 {
            color: var(--t-primary, #0ff);
            text-shadow: 0 0 10px var(--t-primary, #0ff);
            margin: 0;
            font-size: 32px;
        }

        button {
            background: transparent;
            color: var(--t-primary, #0ff);
            border: 2px solid var(--t-primary, #0ff);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--t-primary, #0ff);
            box-shadow: 0 0 5px var(--t-primary, #0ff);
        }

        button:hover {
            background: var(--t-primary, #0ff);
            color: #000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="ui-text">SCORE: <span id="scoreEl">0</span></div>
            <div class="ui-text">LEVEL: <span id="levelEl">1</span></div>
            <div class="ui-text">LIVES: <span id="livesEl">3</span></div>
            <div class="ui-text">HIGHSCORE: <span id="highscoreEl">0</span></div>
        </div>
        <div id="start-screen">
            <h1>NEON INVADERS</h1>
            <p>Steuerung: Pfeiltasten / WASD | Schießen: Leertaste</p>
            <button id="startBtn">SPIEL STARTEN</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>Endscore: <span id="finalScore">0</span></p>
            <button id="restartBtn">NEUSTART</button>
        </div>
    </div>

    <script src="shared/game-core.js"></script>
    <script src="shared/theme.js"></script>
    <script>
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_SPEED = 300;
        const BULLET_SPEED = 500;
        const ALIEN_SPEED_BASE = 50;
        const ALIEN_DROP_HEIGHT = 20;
        const BUNKER_COUNT = 4;
        const BUNKER_BLOCK_SIZE = 10;
        const BUNKER_WIDTH = 60;
        const BUNKER_HEIGHT = 40;

        const COLORS = {
            player: '#00ffff',
            alien: '#00ff00',
            bulletPlayer: '#ff0000',
            bulletAlien: '#ffff00',
            bunker: '#aa00ff',
            star: '#ffffff',
            bg: '#000'
        };

        function applyTheme(palette) {
            COLORS.player = palette.primary;
            COLORS.alien = palette.good;
            COLORS.bulletPlayer = palette.warn;
            COLORS.bulletAlien = palette.accent;
            COLORS.bunker = palette.secondary;
            COLORS.bg = palette.bg;
        }
        applyTheme(Theme.current());

        let particles = [];

        const state = {
            score: 0,
            level: 1,
            lives: 3,
            highscore: GameCore.loadHighscore('neonInvadersHighscore'),
            isRunning: false,
            lastTime: 0,
            keys: {},
            gameOver: false
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const levelEl = document.getElementById('levelEl');
        const livesEl = document.getElementById('livesEl');
        const highscoreEl = document.getElementById('highscoreEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('finalScore');

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * CANVAS_WIDTH;
                this.y = Math.random() * CANVAS_HEIGHT;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 20 + 5;
                this.alpha = Math.random() * 0.5 + 0.3;
            }
            update(dt) {
                this.y += this.speed * dt;
                if (this.y > CANVAS_HEIGHT) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 20;
                this.x = CANVAS_WIDTH / 2 - this.width / 2;
                this.y = CANVAS_HEIGHT - 50;
                this.cooldown = 0;
                this.maxCooldown = 0.3;
            }
            update(dt) {
                if (state.keys['ArrowLeft'] || state.keys['a']) this.x -= PLAYER_SPEED * dt;
                if (state.keys['ArrowRight'] || state.keys['d']) this.x += PLAYER_SPEED * dt;
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;
                if (this.cooldown > 0) this.cooldown -= dt;
                if (state.keys[' '] && this.cooldown <= 0) {
                    this.shoot();
                    this.cooldown = this.maxCooldown;
                }
            }
            shoot() {
                bullets.push(new Bullet(this.x + this.width / 2, this.y, -BULLET_SPEED, 'player'));
            }
            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.player;
                ctx.fillStyle = COLORS.player;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.lineTo(this.x + this.width / 2, this.y + this.height - 5);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Alien {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.width = 30; this.height = 20; this.type = type; this.alive = true;
            }
            draw() {
                if (!this.alive) return;
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS.alien;
                ctx.fillStyle = COLORS.alien;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 5, this.y + 5, 5, 5);
                ctx.fillRect(this.x + 20, this.y + 5, 5, 5);
                ctx.shadowBlur = 0;
            }
        }

        class Bullet {
            constructor(x, y, velocity, owner) {
                this.x = x; this.y = y; this.width = 4; this.height = 10; this.velocity = velocity; this.owner = owner; this.active = true;
            }
            update(dt) {
                this.y += this.velocity * dt;
                if (this.y < 0 || this.y > CANVAS_HEIGHT) this.active = false;
            }
            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.owner === 'player' ? COLORS.bulletPlayer : COLORS.bulletAlien;
                ctx.fillStyle = this.owner === 'player' ? COLORS.bulletPlayer : COLORS.bulletAlien;
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        class Bunker {
            constructor(x, y) {
                this.x = x; this.y = y; this.blocks = []; this.initBlocks();
            }
            initBlocks() {
                const cols = Math.ceil(BUNKER_WIDTH / BUNKER_BLOCK_SIZE);
                const rows = Math.ceil(BUNKER_HEIGHT / BUNKER_BLOCK_SIZE);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let isSolid = true;
                        if (r === 0 && (c === 0 || c === cols - 1)) isSolid = false;
                        if (r === rows - 1 && (c === 1 || c === cols - 2)) isSolid = false;
                        if (isSolid) {
                            this.blocks.push({
                                x: this.x + c * BUNKER_BLOCK_SIZE,
                                y: this.y + r * BUNKER_BLOCK_SIZE,
                                width: BUNKER_BLOCK_SIZE,
                                height: BUNKER_BLOCK_SIZE,
                                active: true
                            });
                        }
                    }
                }
            }
            update() { this.blocks = this.blocks.filter(b => b.active); }
            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS.bunker;
                ctx.fillStyle = COLORS.bunker;
                this.blocks.forEach(block => ctx.fillRect(block.x, block.y, block.width, block.height));
                ctx.shadowBlur = 0;
            }
            checkCollision(bullet) {
                for (let block of this.blocks) {
                    if (bullet.x < block.x + block.width && bullet.x + bullet.width > block.x &&
                        bullet.y < block.y + block.height && bullet.y + bullet.height > block.y) {
                        block.active = false; bullet.active = false; return true;
                    }
                }
                return false;
            }
        }

        let player;
        let aliens = [];
        let bullets = [];
        let bunkers = [];
        let stars = [];
        let alienDirection = 1;
        let alienMoveTimer = 0;
        let alienMoveInterval = 0.5;
        let alienShootTimer = 0;

        let loopController = null;

        function initGame() {
            player = new Player();
            aliens = []; bullets = []; bunkers = []; stars = []; particles = [];
            state.score = 0; state.level = 1; state.lives = 3; state.gameOver = false; state.isRunning = true;
            updateUI();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            for (let i = 0; i < 100; i++) stars.push(new Star());
            const bunkerSpacing = CANVAS_WIDTH / (BUNKER_COUNT + 1);
            for (let i = 0; i < BUNKER_COUNT; i++) {
                bunkers.push(new Bunker(bunkerSpacing * (i + 1) - BUNKER_WIDTH / 2, CANVAS_HEIGHT - 120));
            }
            createAlienGrid();
            if (loopController) loopController.stop();
            loopController = GameCore.startLoop((dt) => {
                if (!state.isRunning) return;
                update(dt);
                draw();
                if (state.gameOver) loopController.stop();
            });
        }

        function createAlienGrid() {
            const rows = 4, cols = 8, padding = 15;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    aliens.push(new Alien(50 + c * (30 + padding), 50 + r * (20 + padding), r));
                }
            }
        }

        window.addEventListener('keydown', e => state.keys[e.key] = true);
        window.addEventListener('keyup', e => state.keys[e.key] = false);
        document.getElementById('startBtn').addEventListener('click', initGame);
        document.getElementById('restartBtn').addEventListener('click', initGame);

        function update(dt) {
            stars.forEach(s => s.update(dt));
            player.update(dt);
            const aliveAliens = aliens.filter(a => a.alive);
            if (aliveAliens.length === 0) {
                state.level++; state.score += 1000; createAlienGrid(); updateUI(); return;
            }
            const speedMultiplier = 1 + (32 - aliveAliens.length) * 0.05;
            alienMoveTimer += dt;
            if (alienMoveTimer > alienMoveInterval / speedMultiplier) {
                alienMoveTimer = 0;
                let hitEdge = false;
                aliens.forEach(a => {
                    if (a.alive) {
                        a.x += (ALIEN_SPEED_BASE * speedMultiplier) * 0.2 * alienDirection;
                        if (a.x <= 10 || a.x + a.width >= CANVAS_WIDTH - 10) hitEdge = true;
                    }
                });
                if (hitEdge) {
                    alienDirection *= -1;
                    aliens.forEach(a => { if (a.alive) a.y += ALIEN_DROP_HEIGHT; });
                }
            }
            alienShootTimer += dt;
            if (alienShootTimer > 1.0 / speedMultiplier) {
                alienShootTimer = 0;
                const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
                if (shooter) bullets.push(new Bullet(shooter.x + shooter.width/2, shooter.y + shooter.height, BULLET_SPEED * 0.6, 'alien'));
            }
            aliens.forEach(a => { if (a.alive && a.y + a.height >= player.y) triggerGameOver(); });
            bullets.forEach(b => b.update(dt));
            checkCollisions();
            bunkers.forEach(b => b.update());
            bullets = bullets.filter(b => b.active);
            GameCore.updateParticles(particles, dt);
            updateUI();
        }

        function checkCollisions() {
            bullets.forEach(b => {
                if (!b.active) return;
                if (b.owner === 'alien') {
                    if (b.x < player.x + player.width && b.x + b.width > player.x &&
                        b.y < player.y + player.height && b.y + b.height > player.y) {
                        b.active = false; playerHit();
                    }
                } else {
                    aliens.forEach(a => {
                        if (a.alive && b.x < a.x + a.width && b.x + b.width > a.x &&
                            b.y < a.y + a.height && b.y + b.height > a.y) {
                            a.alive = false; b.active = false; state.score += 100;
                            GameCore.spawnParticles(particles, a.x + a.width / 2, a.y + a.height / 2, COLORS.alien, 10, { speed: 140, life: 0.5 });
                        }
                    });
                }
                bunkers.forEach(bnk => { if (b.active) bnk.checkCollision(b); });
            });
            // Tote Aliens entfernen, damit das Array pro Level nicht wächst
            aliens = aliens.filter(a => a.alive);
        }

        function playerHit() {
            state.lives--;
            GameCore.spawnParticles(particles, player.x + player.width / 2, player.y + player.height / 2, COLORS.player, 16, { speed: 180, life: 0.6 });
            if (state.lives <= 0) triggerGameOver();
            else bullets = [];
        }

        function triggerGameOver() {
            state.gameOver = true; state.isRunning = false;
            if (state.score > state.highscore) {
                state.highscore = GameCore.saveHighscore('neonInvadersHighscore', state.score);
            }
            finalScoreEl.innerText = state.score;
            gameOverScreen.classList.remove('hidden');
        }

        function draw() {
            ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            stars.forEach(s => s.draw());
            bunkers.forEach(b => b.draw());
            if (player) player.draw();
            aliens.forEach(a => a.draw());
            bullets.forEach(b => b.draw());
            GameCore.drawParticles(ctx, particles);
        }

        function updateUI() {
            scoreEl.innerText = state.score;
            levelEl.innerText = state.level;
            livesEl.innerText = state.lives;
            highscoreEl.innerText = state.highscore;
        }
        highscoreEl.innerText = state.highscore;

        Theme.onThemeChange((palette) => {
            applyTheme(palette);
            if (!state.isRunning) draw();
        });
    </script>
</body>
</html>
