<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTEROIDS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px #0ff;
        }

        .hud-text {
            font-size: 20px;
            font-weight: bold;
            color: #0ff;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid #0ff;
            box-shadow: 0 0 15px #0ff;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            letter-spacing: 5px;
        }

        p {
            font-size: 18px;
            color: #ccc;
        }

        button {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 10px 30px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 5px #0ff;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="hud-text">SCORE: <span id="score">0</span></div>
        <div class="hud-text">HIGHSCORE: <span id="highscore">0</span></div>
        <div class="hud-text">LIVES: <span id="lives">3</span></div>
    </div>

    <div id="start-screen">
        <h1>ASTEROIDS</h1>
        <p>Steuerung: Pfeiltasten / WASD</p>
        <p>Schießen: Leertaste</p>
        <button id="start-btn">Spiel Starten</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Dein Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Neustart</button>
    </div>
</div>

<script>
/**
 * ASTEROIDS GAME ENGINE
 * Single File Implementation - CORRECTED VERSION
 */

// --- Konfiguration ---
const CONFIG = {
    FPS: 60,
    FRICTION: 0.99,
    SHIP_SIZE: 20,
    SHIP_THRUST: 0.15,
    SHIP_ROTATION: 0.07,
    LASER_SPEED: 7,
    LASER_MAX: 10,
    LASER_DIST: 0.6,
    ASTEROID_NUM: 3,
    ASTEROID_SIZE: 100,
    ASTEROID_SPEED: 2,
    ASTEROID_JAG: 0.4,
    TEXT_COLOR: '#0ff',
    BG_COLOR: '#000'
};

// --- Globale Variablen ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highscoreEl = document.getElementById('highscore');
const finalScoreEl = document.getElementById('final-score');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

let gameRunning = false;
let score = 0;
let lives = 3;
let highscore = localStorage.getItem('asteroids_highscore') || 0;
highscoreEl.innerText = highscore;

// Input State
const keys = {
    ArrowUp: false,
    ArrowLeft: false,
    ArrowRight: false,
    w: false,
    a: false,
    d: false,
    " ": false
};

// Entities
let ship;
let asteroids = [];
let bullets = [];
let stars = [];

// --- Klassen ---

class Entity {
    constructor(x, y, vx, vy, radius) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.dead = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // Screen Wrap
        if (this.x < 0 - this.radius) this.x = canvas.width + this.radius;
        else if (this.x > canvas.width + this.radius) this.x = 0 - this.radius;
        if (this.y < 0 - this.radius) this.y = canvas.height + this.radius;
        else if (this.y > canvas.height + this.radius) this.y = 0 - this.radius;
    }
}

class Star extends Entity {
    constructor() {
        super(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            0, 0,
            Math.random() * 2 + 0.5
        );
        this.speed = Math.random() * 0.5 + 0.1;
        this.alpha = Math.random() * 0.5 + 0.3;
    }

    update() {
        this.x -= this.speed;
        if (this.x < 0) this.x = canvas.width;
    }

    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Ship extends Entity {
    constructor() {
        super(canvas.width / 2, canvas.height / 2, 0, 0, CONFIG.SHIP_SIZE / 2);
        this.angle = -Math.PI / 2;
        this.rotationSpeed = CONFIG.SHIP_ROTATION;
        this.thrusting = false;
        this.invulnerable = 120;
        this.blinkTimer = 0;
    }

    update() {
        if (keys.ArrowLeft || keys.a) this.angle -= this.rotationSpeed;
        if (keys.ArrowRight || keys.d) this.angle += this.rotationSpeed;

        if (keys.ArrowUp || keys.w) {
            this.thrusting = true;
            this.vx += Math.cos(this.angle) * CONFIG.SHIP_THRUST;
            this.vy += Math.sin(this.angle) * CONFIG.SHIP_THRUST;
        } else {
            this.thrusting = false;
        }

        this.vx *= CONFIG.FRICTION;
        this.vy *= CONFIG.FRICTION;

        if (this.invulnerable > 0) {
            this.invulnerable--;
            this.blinkTimer++;
        }

        super.update();
    }

    draw() {
        if (this.invulnerable > 0 && Math.floor(this.blinkTimer / 5) % 2 === 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.shadowBlur = 10;
        ctx.shadowColor = CONFIG.TEXT_COLOR;
        ctx.strokeStyle = CONFIG.TEXT_COLOR;
        ctx.lineWidth = 2;
        ctx.fillStyle = '#000';

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.5, 0);
        ctx.lineTo(-this.radius, -this.radius);
        ctx.lineTo(-this.radius * 0.5, 0);
        ctx.lineTo(-this.radius, this.radius);
        ctx.closePath();
        
        ctx.fill();
        ctx.stroke();

        if (this.thrusting) {
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.5, 0);
            ctx.lineTo(-this.radius * 1.5, 0);
            ctx.strokeStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.stroke();
        }

        ctx.restore();
    }

    shoot() {
        if (bullets.length < CONFIG.LASER_MAX) {
            const muzzleX = this.x + Math.cos(this.angle) * (this.radius * CONFIG.LASER_DIST);
            const muzzleY = this.y + Math.sin(this.angle) * (this.radius * CONFIG.LASER_DIST);
            const velX = Math.cos(this.angle) * CONFIG.LASER_SPEED;
            const velY = Math.sin(this.angle) * CONFIG.LASER_SPEED;
            bullets.push(new Bullet(muzzleX, muzzleY, velX, velY));
        }
    }
}

class Asteroid extends Entity {
    constructor(x, y, radius) {
        super(x, y, 0, 0, radius);
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * CONFIG.ASTEROID_SPEED;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.vertices = [];
        const numVertices = Math.floor(Math.random() * 6) + 7;
        for (let i = 0; i < numVertices; i++) {
            const angle = (Math.PI * 2 / numVertices) * i;
            const r = this.radius * (1 - CONFIG.ASTEROID_JAG + Math.random() * CONFIG.ASTEROID_JAG * 2);
            this.vertices.push({
                x: Math.cos(angle) * r,
                y: Math.sin(angle) * r
            });
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        ctx.shadowBlur = 5;
        ctx.shadowColor = CONFIG.TEXT_COLOR;
        ctx.strokeStyle = CONFIG.TEXT_COLOR;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
        for (let i = 1; i < this.vertices.length; i++) {
            ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }

    split() {
        const newRadius = this.radius / 2;
        if (newRadius >= 10) {
            asteroids.push(new Asteroid(this.x, this.y, newRadius));
            asteroids.push(new Asteroid(this.x, this.y, newRadius));
        }
    }
}

class Bullet extends Entity {
    constructor(x, y, vx, vy) {
        super(x, y, vx, vy, 2);
        this.life = 60;
    }

    update() {
        super.update();
        this.life--;
        if (this.life <= 0) this.dead = true;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#ff0';
        ctx.strokeStyle = '#ff0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

// --- Hilfsfunktionen ---

function createAsteroids() {
    asteroids = [];
    for (let i = 0; i < CONFIG.ASTEROID_NUM; i++) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (distBetweenPoints(ship.x, ship.y, x, y) < CONFIG.ASTEROID_SIZE * 2);
        
        asteroids.push(new Asteroid(x, y, CONFIG.ASTEROID_SIZE / 2));
    }
}

function distBetweenPoints(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function checkCollisions() {
    // Bullet vs Asteroid
    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const b = bullets[i];
            const a = asteroids[j];
            if (distBetweenPoints(b.x, b.y, a.x, a.y) < a.radius + b.radius) {
                // Treffer - Asteroid markieren als tot
                b.dead = true;
                a.dead = true; // FIX: Asteroid wird jetzt als tot markiert
                a.split();
                score += 100;
                scoreEl.innerText = score;
                break;
            }
        }
    }

    // Ship vs Asteroid
    if (ship.invulnerable <= 0) {
        for (let i = 0; i < asteroids.length; i++) {
            const a = asteroids[i];
            if (distBetweenPoints(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius) {
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    gameOver();
                } else {
                    ship.x = canvas.width / 2;
                    ship.y = canvas.height / 2;
                    ship.vx = 0;
                    ship.vy = 0;
                    ship.invulnerable = 120;
                }
                break;
            }
        }
    }
}

function update() {
    if (!gameRunning) return;

    // Hintergrund Sterne
    stars.forEach(star => star.update());

    // Schiff
    ship.update();
    if (keys[" "]) {
        ship.shoot();
        keys[" "] = false;
    }

    // Asteroiden
    asteroids.forEach(asteroid => asteroid.update());

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        if (bullets[i].dead) bullets.splice(i, 1);
    }

    checkCollisions();

    // FIX: Saubere Filter-Routine für tote Asteroiden
    asteroids = asteroids.filter(a => !a.dead);
}

function draw() {
    ctx.fillStyle = CONFIG.BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => star.draw());
    asteroids.forEach(asteroid => asteroid.draw());
    bullets.forEach(bullet => bullet.draw());
    ship.draw();
}

function gameLoop() {
    if (gameRunning) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
}

function startGame() {
    score = 0;
    lives = 3;
    scoreEl.innerText = score;
    livesEl.innerText = lives;
    
    ship = new Ship();
    bullets = [];
    createAsteroids();
    
    stars = [];
    for(let i=0; i<100; i++) stars.push(new Star());

    gameRunning = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    gameLoop();
}

function gameOver() {
    gameRunning = false;
    if (score > highscore) {
        highscore = score;
        localStorage.setItem('asteroids_highscore', highscore);
        highscoreEl.innerText = highscore;
    }
    finalScoreEl.innerText = score;
    gameOverScreen.classList.remove('hidden');
}

// --- Event Listeners ---

window.addEventListener('keydown', e => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    if (e.key === " " && gameRunning) keys[" "] = true;
});

window.addEventListener('keyup', e => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Initiale Sterne für Hintergrund
stars = [];
for(let i=0; i<100; i++) stars.push(new Star());

function drawBackgroundOnly() {
    if (!gameRunning) {
        ctx.fillStyle = CONFIG.BG_COLOR;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
            star.update();
            star.draw();
        });
        requestAnimationFrame(drawBackgroundOnly);
    }
}
drawBackgroundOnly();

</script>
</body>
</html>
