<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTEROIDS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--t-bg, #000);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: var(--t-text, #fff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 2px solid var(--t-border, #333);
        }

        canvas {
            display: block;
            background-color: var(--t-bg, #000);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--t-primary, #0ff);
        }

        .hud-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--t-primary, #0ff);
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid var(--t-primary, #0ff);
            box-shadow: 0 0 15px var(--t-primary, #0ff);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            color: var(--t-primary, #0ff);
            text-shadow: 0 0 10px var(--t-primary, #0ff);
            letter-spacing: 5px;
        }

        p {
            font-size: 18px;
            color: #ccc;
        }

        button {
            background: transparent;
            border: 2px solid var(--t-primary, #0ff);
            color: var(--t-primary, #0ff);
            padding: 10px 30px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 5px var(--t-primary, #0ff);
        }

        button:hover {
            background: var(--t-primary, #0ff);
            color: #000;
            box-shadow: 0 0 20px var(--t-primary, #0ff);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="hud-text">SCORE: <span id="score">0</span></div>
        <div class="hud-text">HIGHSCORE: <span id="highscore">0</span></div>
        <div class="hud-text">LIVES: <span id="lives">3</span></div>
    </div>

    <div id="start-screen">
        <h1>ASTEROIDS</h1>
        <p>Steuerung: Pfeiltasten / WASD</p>
        <p>Schießen: Leertaste</p>
        <button id="start-btn">Spiel Starten</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Dein Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Neustart</button>
    </div>
</div>

<script src="shared/game-core.js"></script>
<script src="shared/theme.js"></script>
<script>
/**
 * ASTEROIDS GAME ENGINE
 * Single File Implementation - CORRECTED VERSION
 */

// --- Konfiguration (Bewegungswerte in Einheiten pro Sekunde) ---
const CONFIG = {
    FRICTION: 0.99, // Faktor pro Frame @60fps, wird dt-korrekt per Math.pow skaliert
    SHIP_SIZE: 20,
    SHIP_THRUST: 9, // px/s^2
    SHIP_ROTATION: 4.2, // rad/s
    LASER_SPEED: 420, // px/s
    LASER_MAX: 10,
    LASER_DIST: 0.6,
    LASER_LIFE: 1.0, // Sekunden
    ASTEROID_NUM: 3,
    ASTEROID_SIZE: 100,
    ASTEROID_SPEED: 120, // px/s
    ASTEROID_JAG: 0.4,
    SHIP_INVULN_TIME: 2.0, // Sekunden
    TEXT_COLOR: '#0ff',
    ACCENT_COLOR: '#ff0',
    THRUST_COLOR: '#f00',
    BG_COLOR: '#000'
};

function applyTheme(palette) {
    CONFIG.TEXT_COLOR = palette.primary;
    CONFIG.ACCENT_COLOR = palette.accent;
    CONFIG.THRUST_COLOR = palette.warn;
    CONFIG.BG_COLOR = palette.bg;
}
applyTheme(Theme.current());

// --- Globale Variablen ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highscoreEl = document.getElementById('highscore');
const finalScoreEl = document.getElementById('final-score');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

let gameRunning = false;
let score = 0;
let lives = 3;
let highscore = GameCore.loadHighscore('asteroids_highscore');
highscoreEl.innerText = highscore;
let particles = [];

Theme.onThemeChange((palette) => {
    applyTheme(palette);
    if (!gameRunning) draw();
});

// Input State
const keys = {
    ArrowUp: false,
    ArrowLeft: false,
    ArrowRight: false,
    w: false,
    a: false,
    d: false,
    " ": false
};

// Entities
let ship;
let asteroids = [];
let bullets = [];
let stars = [];

// --- Klassen ---

class Entity {
    constructor(x, y, vx, vy, radius) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.dead = false;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Screen Wrap
        if (this.x < 0 - this.radius) this.x = canvas.width + this.radius;
        else if (this.x > canvas.width + this.radius) this.x = 0 - this.radius;
        if (this.y < 0 - this.radius) this.y = canvas.height + this.radius;
        else if (this.y > canvas.height + this.radius) this.y = 0 - this.radius;
    }
}

class Star extends Entity {
    constructor() {
        super(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            0, 0,
            Math.random() * 2 + 0.5
        );
        this.speed = Math.random() * 30 + 6; // px/s
        this.alpha = Math.random() * 0.5 + 0.3;
    }

    update(dt) {
        this.x -= this.speed * dt;
        if (this.x < 0) this.x = canvas.width;
    }

    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Ship extends Entity {
    constructor() {
        super(canvas.width / 2, canvas.height / 2, 0, 0, CONFIG.SHIP_SIZE / 2);
        this.angle = -Math.PI / 2;
        this.rotationSpeed = CONFIG.SHIP_ROTATION;
        this.thrusting = false;
        this.invulnerable = CONFIG.SHIP_INVULN_TIME;
        this.blinkTimer = 0;
    }

    update(dt) {
        if (keys.ArrowLeft || keys.a) this.angle -= this.rotationSpeed * dt;
        if (keys.ArrowRight || keys.d) this.angle += this.rotationSpeed * dt;

        if (keys.ArrowUp || keys.w) {
            this.thrusting = true;
            this.vx += Math.cos(this.angle) * CONFIG.SHIP_THRUST * dt;
            this.vy += Math.sin(this.angle) * CONFIG.SHIP_THRUST * dt;
        } else {
            this.thrusting = false;
        }

        const frictionFactor = Math.pow(CONFIG.FRICTION, dt * 60);
        this.vx *= frictionFactor;
        this.vy *= frictionFactor;

        if (this.invulnerable > 0) {
            this.invulnerable -= dt;
            this.blinkTimer += dt;
        }

        super.update(dt);
    }

    draw() {
        if (this.invulnerable > 0 && Math.floor(this.blinkTimer / 0.0833) % 2 === 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.shadowBlur = 10;
        ctx.shadowColor = CONFIG.TEXT_COLOR;
        ctx.strokeStyle = CONFIG.TEXT_COLOR;
        ctx.lineWidth = 2;
        ctx.fillStyle = '#000';

        ctx.beginPath();
        ctx.moveTo(this.radius * 1.5, 0);
        ctx.lineTo(-this.radius, -this.radius);
        ctx.lineTo(-this.radius * 0.5, 0);
        ctx.lineTo(-this.radius, this.radius);
        ctx.closePath();
        
        ctx.fill();
        ctx.stroke();

        if (this.thrusting) {
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.5, 0);
            ctx.lineTo(-this.radius * 1.5, 0);
            ctx.strokeStyle = CONFIG.THRUST_COLOR;
            ctx.shadowColor = CONFIG.THRUST_COLOR;
            ctx.stroke();
        }

        ctx.restore();
    }

    shoot() {
        if (bullets.length < CONFIG.LASER_MAX) {
            const muzzleX = this.x + Math.cos(this.angle) * (this.radius * CONFIG.LASER_DIST);
            const muzzleY = this.y + Math.sin(this.angle) * (this.radius * CONFIG.LASER_DIST);
            const velX = Math.cos(this.angle) * CONFIG.LASER_SPEED;
            const velY = Math.sin(this.angle) * CONFIG.LASER_SPEED;
            bullets.push(new Bullet(muzzleX, muzzleY, velX, velY));
        }
    }
}

class Asteroid extends Entity {
    constructor(x, y, radius) {
        super(x, y, 0, 0, radius);
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * CONFIG.ASTEROID_SPEED;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.vertices = [];
        const numVertices = Math.floor(Math.random() * 6) + 7;
        for (let i = 0; i < numVertices; i++) {
            const angle = (Math.PI * 2 / numVertices) * i;
            const r = this.radius * (1 - CONFIG.ASTEROID_JAG + Math.random() * CONFIG.ASTEROID_JAG * 2);
            this.vertices.push({
                x: Math.cos(angle) * r,
                y: Math.sin(angle) * r
            });
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        ctx.shadowBlur = 5;
        ctx.shadowColor = CONFIG.TEXT_COLOR;
        ctx.strokeStyle = CONFIG.TEXT_COLOR;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
        for (let i = 1; i < this.vertices.length; i++) {
            ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }

    split() {
        const newRadius = this.radius / 2;
        if (newRadius >= 10) {
            asteroids.push(new Asteroid(this.x, this.y, newRadius));
            asteroids.push(new Asteroid(this.x, this.y, newRadius));
        }
    }
}

class Bullet extends Entity {
    constructor(x, y, vx, vy) {
        super(x, y, vx, vy, 2);
        this.life = CONFIG.LASER_LIFE;
    }

    update(dt) {
        super.update(dt);
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 5;
        ctx.shadowColor = CONFIG.ACCENT_COLOR;
        ctx.strokeStyle = CONFIG.ACCENT_COLOR;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

// --- Hilfsfunktionen ---

function createAsteroids() {
    asteroids = [];
    for (let i = 0; i < CONFIG.ASTEROID_NUM; i++) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (distBetweenPoints(ship.x, ship.y, x, y) < CONFIG.ASTEROID_SIZE * 2);
        
        asteroids.push(new Asteroid(x, y, CONFIG.ASTEROID_SIZE / 2));
    }
}

function distBetweenPoints(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function checkCollisions() {
    // Bullet vs Asteroid
    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const b = bullets[i];
            const a = asteroids[j];
            if (distBetweenPoints(b.x, b.y, a.x, a.y) < a.radius + b.radius) {
                // Treffer - Asteroid markieren als tot
                b.dead = true;
                a.dead = true; // FIX: Asteroid wird jetzt als tot markiert
                a.split();
                GameCore.spawnParticles(particles, a.x, a.y, CONFIG.TEXT_COLOR, 12, { speed: 180, life: 0.5 });
                score += 100;
                scoreEl.innerText = score;
                break;
            }
        }
    }

    // Ship vs Asteroid
    if (ship.invulnerable <= 0) {
        for (let i = 0; i < asteroids.length; i++) {
            const a = asteroids[i];
            if (distBetweenPoints(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius) {
                lives--;
                livesEl.innerText = lives;
                GameCore.spawnParticles(particles, ship.x, ship.y, CONFIG.THRUST_COLOR, 20, { speed: 220, life: 0.6 });
                if (lives <= 0) {
                    gameOver();
                } else {
                    ship.x = canvas.width / 2;
                    ship.y = canvas.height / 2;
                    ship.vx = 0;
                    ship.vy = 0;
                    ship.invulnerable = CONFIG.SHIP_INVULN_TIME;
                }
                break;
            }
        }
    }
}

function update(dt) {
    if (!gameRunning) return;

    // Hintergrund Sterne
    stars.forEach(star => star.update(dt));

    // Schiff
    ship.update(dt);
    if (keys[" "]) {
        ship.shoot();
        keys[" "] = false;
    }

    // Asteroiden
    asteroids.forEach(asteroid => asteroid.update(dt));

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update(dt);
        if (bullets[i].dead) bullets.splice(i, 1);
    }

    checkCollisions();
    GameCore.updateParticles(particles, dt);

    // FIX: Saubere Filter-Routine für tote Asteroiden
    asteroids = asteroids.filter(a => !a.dead);

    // Neue Welle, wenn alle Asteroiden zerstört sind
    if (asteroids.length === 0) {
        createAsteroids();
    }
}

function draw() {
    ctx.fillStyle = CONFIG.BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => star.draw());
    asteroids.forEach(asteroid => asteroid.draw());
    bullets.forEach(bullet => bullet.draw());
    GameCore.drawParticles(ctx, particles);
    if (ship) ship.draw();
}

let loopController = null;

function startGame() {
    score = 0;
    lives = 3;
    scoreEl.innerText = score;
    livesEl.innerText = lives;

    ship = new Ship();
    bullets = [];
    particles = [];
    createAsteroids();

    stars = [];
    for(let i=0; i<100; i++) stars.push(new Star());

    gameRunning = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    bgLoopController.stop();
    if (loopController) loopController.stop();
    loopController = GameCore.startLoop((dt) => {
        if (!gameRunning) return;
        update(dt);
        draw();
    });
}

function gameOver() {
    gameRunning = false;
    if (loopController) loopController.stop();
    bgLoopController.resume();
    if (score > highscore) {
        highscore = GameCore.saveHighscore('asteroids_highscore', score);
        highscoreEl.innerText = highscore;
    }
    finalScoreEl.innerText = score;
    gameOverScreen.classList.remove('hidden');
}

// --- Event Listeners ---

window.addEventListener('keydown', e => {
    const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = true;
    if (e.key === " " && gameRunning) keys[" "] = true;
});

window.addEventListener('keyup', e => {
    const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = false;
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Initiale Sterne für Hintergrund
stars = [];
for(let i=0; i<100; i++) stars.push(new Star());

const bgLoopController = GameCore.startLoop((dt) => {
    ctx.fillStyle = CONFIG.BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(star => {
        star.update(dt);
        star.draw();
    });
});

</script>
</body>
</html>
